# ---- Project Info and Dependencies ----

[project]
name = "ogsync"
description = "Sync Outlook events to Google Calendar using COM."
readme = "README.md"
requires-python = ">=3.12,<4.0"

license-files = ["LICENSE"]

authors = [
  { name = "Karl Wooster", email = "karl@woostertech.com" },
]
# https://pypi.org/classifiers/
# Adjust as needed:
classifiers = [
  # Adjust as needed:
  "Development Status :: 4 - Beta",
  # "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  # Include this to avoid accidentally publishing to PyPI:
  "Private :: Do Not Upload",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# ---- Main dependencies ----
dependencies = [
  "attrmagic>=0.2.3",
  "google>=3.0.0",
  "google-api-python-client>=2.200.0",
  "google-auth-oauthlib>=1.4.1",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.11.0",
  "pywin32>=312",
  "rich>=14.0.0",
  "sqlite-utils>=4.2.1",
  "typer>=0.24.1",
  "tzdata>=2026.3 ; sys_platform == 'win32'",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/WoosterTech/ogsync"
# Homepage = "https://..."
# Documentation = "https://..."

[project.scripts]
# Add script entry points here:
ogsync = "ogsync.ogsync:cli"
ogsync-devtools = "ogsync.devtools:app"

# ---- Build system ----

# Dynamic versioning from:
# https://github.com/ninoseki/uv-dynamic-versioning/

[dependency-groups]
dev = [
  "basedpyright>=1.31.0",
  "codespell>=2.4.1",
  "deptry>=0.23.0",
  "google-api-python-client-stubs>=1.40.0",
  "ipython>=9.8.0",
  "jinja2>=3.1.6",
  "prek>=0.4.3",
  "pydantic>=2.11.9",
  "pytest>=8.3.5",
  "pytest-sugar>=1.0.0",
  "rich>=14.0.0",
  "ruff>=0.11.9",
]
docs = [
  "zensical>=0.0.43",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.codespell]
# Add here as needed:
# ignore-words-list = "foo,bar"
# skip = "foo.py,bar.py"

# ---- Dev dependencies ----
[tool.deptry]
extend_exclude = ["src/ogsync/devtools\\.py"]
known_first_party = ["ogsync"]

[tool.deptry.per_rule_ignores]
DEP002 = [
  "tzdata",  # required for time zone support on Windows
  ]

[tool.hatch.version]
source = "uv-dynamic-versioning"
# Note JSON schemas don't seem to be right for tool.hatch.version.source so
# this may cause false warnings in IDEs.
# https://github.com/ninoseki/uv-dynamic-versioning/issues/21

[tool.hatch.build.targets.wheel]
# The source location for the package.
packages = ["src/ogsync"]

# ---- Settings ----

[tool.pytest]
filterwarnings = []
norecursedirs = []
python_classes = ["Test*"]
python_files = ["*.py"]
python_functions = ["test_*"]
testpaths = [
  "src",
  "tests",
]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
